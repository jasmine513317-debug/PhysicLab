name: Publish PhysicLab to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: physiclab-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm test
      - name: Build the site and direct-entry routes
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build -- --base "${PAGES_BASE%/}/"
          node scripts/pages-routes.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
